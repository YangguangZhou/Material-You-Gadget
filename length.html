<body>
    <!-- 返回按钮 -->
    <button id="back-to-home" class="back-to-home-btn" title="返回主站">

    <div class="container">
        <h1 class="text-2xl font-bold mb-4 text-center">长度单位转换和显示</h1>
        
        <div class="input-group">
            <input type="number" id="length" step="0.1" min="0" placeholder="输入长度">
            <select id="unit">
                <option value="px">px</option>
                <option value="em">em</option>
                <option value="rem">rem</option>
                <option value="%">%</option>
                <option value="vw">vw</option>
                <option value="vh">vh</option>
                <option value="cm">cm</option>
                <option value="mm">mm</option>
                <option value="in">in</option>
                <option value="pt">pt</option>
            </select>
        </div>

        <!-- 滑动选择器 -->
        <div class="slider-container">
            <label for="length-slider">长度调整:</label>
            <input type="range" min="0" max="100" value="10" class="slider" id="length-slider">
        </div>
        
        <button id="convert" class="btn w-full">转换并显示</button>
        
        <div id="line-container">
            <div id="line"></div>
        </div>
        
        <p id="lineLength" class="text-center mb-2 font-semibold"></p>
        
        <div id="conversions"></div>

        <div class="mt-4 p-4 bg-gray-50 rounded-lg text-sm">
            <p class="mb-2"><strong>基准设置:</strong></p>
            <div class="flex items-center mb-2">
                <label for="base-font-size" class="mr-2">基准字体大小: </label>
                <input type="number" id="base-font-size" class="w-16 p-1 border rounded" value="16" min="1"> px
                <div class="tooltip">
                    <span class="material-icons-outlined text-sm">help_outline</span>
                    <span class="tooltiptext">em和rem单位的基准字体大小。默认为16px。</span>
                </div>
            </div>
            <div class="flex items-center">
                <label for="dpi-setting" class="mr-2">屏幕DPI: </label>
                <input type="number" id="dpi-setting" class="w-16 p-1 border rounded" value="96" min="1">
                <div class="tooltip">
                    <span class="material-icons-outlined text-sm">help_outline</span>
                    <span class="tooltiptext">影响物理单位(cm, mm, in)与像素的换算。默认为96。</span>
                </div>
            </div>

    <!-- 页脚 -->
    <footer class="footer">
        <p>&copy; 2024-2025 <a href="https://jerryz.com.cn" target="_blank" rel="noopener">Jerry Zhou</a> | <a href="https://github.com/YangguangZhou/Material-You-Gadget" target="_blank" rel="noopener noreferrer">GitHub</a></p>
    </footer>

    <script>
        // 获取元素
        const lengthInput = document.getElementById('length');
        const unitSelect = document.getElementById('unit');
        const convertBtn = document.getElementById('convert');
        const line = document.getElementById('line');
        const lineLength = document.getElementById('lineLength');
        const conversions = document.getElementById('conversions');
        const lengthSlider = document.getElementById('length-slider');
        const baseFontSize = document.getElementById('base-font-size');
        const dpiSetting = document.getElementById('dpi-setting');
        const backBtn = document.getElementById('back-to-home');
        
        // 支持的单位数组
        const units = ['px', 'em', 'rem', '%', 'vw', 'vh', 'cm', 'mm', 'in', 'pt'];
        
        // 返回按钮事件
        backBtn.addEventListener('click', () => {
            window.location.href = 'https://md.jerryz.com.cn/';
        });

        // 滑动条事件
        lengthSlider.addEventListener('input', () => {
            lengthInput.value = lengthSlider.value;
        });

        // 输入框事件
        lengthInput.addEventListener('input', () => {
            const value = parseFloat(lengthInput.value);
            if (!isNaN(value) && value >= 0 && value <= 100) {
                lengthSlider.value = value;
            }
        });
        
        // 转换按钮事件
        convertBtn.addEventListener('click', () => {
            const length = parseFloat(lengthInput.value);
            const unit = unitSelect.value;
        
            if (isNaN(length) || length <= 0) {
                alert('请输入有效的正数');
                return;
            }
        
            // 设置线条高度 - 按比例调整以适应显示区域
            let displayHeight;
            
            switch (unit) {
                case 'px':
                    displayHeight = length;
                    break;
                case 'em':
                case 'rem':
                    displayHeight = length * parseFloat(baseFontSize.value);
                    break;
                case '%':
                    displayHeight = length * document.getElementById('line-container').clientHeight / 100;
                    break;
                case 'vw':
                    displayHeight = length * window.innerWidth / 100;
                    break;
                case 'vh':
                    displayHeight = length * window.innerHeight / 100;
                    break;
                case 'cm':
                    displayHeight = length * parseFloat(dpiSetting.value) / 2.54;
                    break;
                case 'mm':
                    displayHeight = length * parseFloat(dpiSetting.value) / 25.4;
                    break;
                case 'in':
                    displayHeight = length * parseFloat(dpiSetting.value);
                    break;
                case 'pt':
                    displayHeight = length * parseFloat(dpiSetting.value) / 72;
                    break;
                default:
                    displayHeight = length;
            }
            
            // 限制显示高度，保持合理显示范围
            const maxHeight = document.getElementById('line-container').clientHeight - 10;
            const scaleFactor = displayHeight > maxHeight ? maxHeight / displayHeight : 1;
            const scaledHeight = displayHeight * scaleFactor;
            
            line.style.height = `${scaledHeight}px`;
            lineLength.textContent = `线条长度: ${length}${unit}` + 
                (scaleFactor < 1 ? ` (已缩放 ${(scaleFactor * 100).toFixed(0)}% 以适应显示区域)` : '');
        
            // 转换到其他单位
            let conversionHtml = '<h2 class="text-lg font-semibold mb-2">换算结果:</h2>';
            
            units.forEach(toUnit => {
                if (toUnit !== unit) {
                    const convertedValue = convertUnit(length, unit, toUnit);
                    conversionHtml += `<p class="mb-1">${convertedValue} ${toUnit}</p>`;
                }
            });
            
            conversions.innerHTML = conversionHtml;
            conversions.style.display = 'block';
        });
        
        // 单位转换函数
        function convertUnit(value, fromUnit, toUnit) {
            // 先转换为像素
            const pxValue = toPx(value, fromUnit);
            // 再从像素转换为目标单位
            return fromPx(pxValue, toUnit).toFixed(2);
        }
        
        function toPx(value, unit) {
            const fontBase = parseFloat(baseFontSize.value);
            const dpi = parseFloat(dpiSetting.value);
            
            switch (unit) {
                case 'px': 
                    return value;
                case 'em':
                case 'rem': 
                    return value * fontBase;
                case '%': 
                    // 在这里我们使用容器宽度作为参考，更符合CSS的实际行为
                    return value * document.querySelector('.container').clientWidth / 100;
                case 'vw': 
                    return value * window.innerWidth / 100;
                case 'vh': 
                    return value * window.innerHeight / 100;
                case 'cm': 
                    return value * dpi / 2.54; // 1英寸 = 2.54厘米
                case 'mm': 
                    return value * dpi / 25.4; // 1英寸 = 25.4毫米
                case 'in': 
                    return value * dpi; // 直接乘以DPI
                case 'pt': 
                    return value * dpi / 72; // 1英寸 = 72pt
                default: 
                    return value;
            }
        }
        
        function fromPx(px, unit) {
            const fontBase = parseFloat(baseFontSize.value);
            const dpi = parseFloat(dpiSetting.value);
            
            switch (unit) {
                case 'px': 
                    return px;
                case 'em':
                case 'rem': 
                    return px / fontBase;
                case '%': 
                    return (px / document.querySelector('.container').clientWidth) * 100;
                case 'vw': 
                    return (px / window.innerWidth) * 100;
                case 'vh': 
                    return (px / window.innerHeight) * 100;
                case 'cm': 
                    return px * 2.54 / dpi;
                case 'mm': 
                    return px * 25.4 / dpi;
                case 'in': 
                    return px / dpi;
                case 'pt': 
                    return px * 72 / dpi;
                default: 
                    return px;
            }
        }

        // 初始化
        lengthInput.value = lengthSlider.value;
    </script>
