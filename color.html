        <style>
        :root {
            /* Material You 颜色系统 */
            --md-sys-color-primary: #006493;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #c9e6ff;
            --md-sys-color-on-primary-container: #001e30;
            --md-sys-color-secondary: #4d616c;
            --md-sys-color-on-secondary: #FFFFFF;
            --md-sys-color-secondary-container: #d0e6f2;
            --md-sys-color-on-secondary-container: #071e28;
            --md-sys-color-tertiary: #5d5b7d;
            --md-sys-color-on-tertiary: #FFFFFF;
            --md-sys-color-tertiary-container: #e3dfff;
            --md-sys-color-on-tertiary-container: #1c1936;
            --md-sys-color-error: #B00020;
            --md-sys-color-on-error: #FFFFFF;
            --md-sys-color-surface: #FFFBFE;
            --md-sys-color-on-surface: #1C1B1F;
            --md-sys-color-surface-variant: #e2ecf2;
            --md-sys-color-on-surface-variant: #49454F;
            --md-sys-color-outline: #79747E;
            --md-sys-color-background: #F8F9FA;
            --md-sys-color-on-background: #1C1B1F;
            
            /* 老的变量兼容 */
            --primary-color: var(--md-sys-color-primary);
            --on-primary-color: var(--md-sys-color-on-primary);
            --surface-color: var(--md-sys-color-surface);
            --on-surface-color: var(--md-sys-color-on-surface);
            --secondary-color: var(--md-sys-color-primary-container);
            --error-color: var(--md-sys-color-error);
            
            /* 圆角和阴影 */
            --border-radius: 16px;
            --border-radius-full: 50%;
            --elevation-1: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
            --elevation-2: 0 3px 6px rgba(0,0,0,0.15), 0 2px 4px rgba(0,0,0,0.12);
            --elevation-3: 0 10px 20px rgba(0,0,0,0.15), 0 3px 6px rgba(0,0,0,0.10);
        }
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background-color: #FFFFFF;
            border-radius: var(--border-radius);
            box-shadow: var(--elevation-2);
            overflow: hidden;
            transition: box-shadow 0.3s ease;
            margin-top: 40px;
            margin-bottom: 40px;
        }
        .container:hover {
            box-shadow: var(--elevation-3);
        }
        .app-bar {
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            padding: 24px 20px;
            font-size: 24px;
            font-weight: 500;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .content {
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #imagePreview {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: var(--border-radius);
            margin-bottom: 24px;
            background-color: var(--md-sys-color-surface-variant);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 18px;
            box-shadow: var(--elevation-1);
        }
        .button {
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border: none;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
            margin-bottom: 24px;
            box-shadow: var(--elevation-1);
        }
        .button:hover {
            transform: translateY(-2px);
            box-shadow: var(--elevation-3);
        }
        .button:active {
            transform: translateY(0);
            box-shadow: var(--elevation-1);
        }
        #colorInfo {
            font-size: 18px;
            text-align: center;
            margin-top: 24px;
            line-height: 1.6;
        }
        .color-preview {
            width: 120px;
            height: 120px;
            border-radius: var(--border-radius-full);
            margin: 24px auto;
            border: 4px solid var(--md-sys-color-primary-container);
            transition: background-color 0.3s ease;
            box-shadow: var(--elevation-2);
        }
        
        /* 返回按钮样式 */
        .back-to-home-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 48px;

            border: none;

            align-items: center;

<body>
    <!-- 返回按钮 -->
    <button id="back-to-home" class="back-to-home-btn" title="返回主站">
        <span class="material-icons-outlined">arrow_back</span>
    </button>

    <div class="container">
        <div class="app-bar">主色提取</div>
        <div class="content">
            <input type="file" id="imageUpload" accept="image/*" style="display: none;">
            <button class="button" onclick="document.getElementById('imageUpload').click()">上传图片</button>
            <div id="imagePreview">请上传图片</div>
            <div class="color-preview" id="colorPreview"></div>
            <p id="colorInfo"></p>
        </div>
    </div>
    
    <!-- 改进的 Footer -->
    <footer class="footer">
        <p>&copy; 2024-2025 <a href="https://jerryz.com.cn" target="_blank" rel="noopener">Jerry Zhou</a> | <a href="https://github.com/YangguangZhou/Material-You-Gadget" target="_blank" rel="noopener noreferrer">GitHub</a></p>
    </footer>

    <script>
        const colorThief = new ColorThief();
        const imageUpload = document.getElementById('imageUpload');
        const imagePreview = document.getElementById('imagePreview');
        const colorInfo = document.getElementById('colorInfo');
        const colorPreview = document.getElementById('colorPreview');
        
        // 返回按钮功能
        document.getElementById('back-to-home').addEventListener('click', function() {
            window.location.href = 'https://md.jerryz.com.cn/';
        });

        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();

            reader.onload = function(event) {
                imagePreview.innerHTML = '';
                const img = new Image();
                img.src = event.target.result;
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.objectFit = 'cover';
                imagePreview.appendChild(img);

                img.onload = function() {
                    const color = colorThief.getColor(img);
                    applyColorTheme(color);
                }
            }

            reader.readAsDataURL(file);
        });

        function applyColorTheme(color) {
            const [r, g, b] = color;
            const hexColor = rgbToHex(r, g, b);
            
            // 更新主要颜色变量
            document.documentElement.style.setProperty('--md-sys-color-primary', `rgb(${r}, ${g}, ${b})`);
            document.documentElement.style.setProperty('--primary-color', `rgb(${r}, ${g}, ${b})`);
            
            // 根据颜色亮度决定文字颜色
            const isLight = isColorLight(r, g, b);
            document.documentElement.style.setProperty('--md-sys-color-on-primary', isLight ? '#000000' : '#FFFFFF');
            document.documentElement.style.setProperty('--on-primary-color', isLight ? '#000000' : '#FFFFFF');
            
            // 生成辅助颜色（轻微变暗或变亮的主色）
            const primaryContainer = isLight 
                ? `rgb(${Math.max(r-40, 0)}, ${Math.max(g-40, 0)}, ${Math.max(b-40, 0)})` 
                : `rgb(${Math.min(r+60, 255)}, ${Math.min(g+60, 255)}, ${Math.min(b+60, 255)})`;
            document.documentElement.style.setProperty('--md-sys-color-primary-container', primaryContainer);
            document.documentElement.style.setProperty('--secondary-color', primaryContainer);
            
            // 更新按钮颜色
            const buttons = document.querySelectorAll('.button');
            buttons.forEach(button => {
                button.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
                button.style.color = isLight ? '#000000' : '#FFFFFF';
            });

            colorPreview.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
            colorInfo.innerHTML = `提取的主色：<br>RGB(${r}, ${g}, ${b})<br>HEX: ${hexColor}<br><br>点击上方按钮可再次上传图片`;
            
            // 更新app-bar颜色
            document.querySelector('.app-bar').style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
            document.querySelector('.app-bar').style.color = isLight ? '#000000' : '#FFFFFF';
        }

        function isColorLight(r, g, b) {
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            return brightness > 128;
        }

        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(x => {
                const hex = x.toString(16);
                return hex.length === 1 ? '0' + hex : hex;
            }).join('');
        }
    </script>
