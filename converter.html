<body>
    <!-- 返回按钮 -->
    <button id="back-to-home" class="back-to-home-btn" title="返回主站">
        <span class="material-icons-outlined">arrow_back</span>
    </button>
    
    <div class="container">
        <div class="card">
            <div class="card-header"><h1>颜色转换器</h1></div>
            <div class="card-content">
                <div class="form-group">
                    <label for="colorInput" class="form-label">输入RGB或16进制颜色值</label>
                    <input type="text" class="form-control" id="colorInput" placeholder="例如: #279cff 或 rgb(39, 156, 255)">
                </div>
                <div class="color-picker-container">
                    <label for="colorPicker" class="form-label">或选择颜色:</label>
                    <input type="color" id="colorPicker" value="#006A6A">
                </div>
                <div id="colorDisplay"></div>
                <div id="output">
                    <p>RGB值: <span id="rgbValue">--</span>
                        <button id="copyRgb" class="copy-button">
                            <span class="material-symbols-outlined" style="color: #fff;">content_copy</span>复制
                        </button>
                    </p>
                    <p>16进制值: <span id="hexValue">--</span>
                        <button id="copyHex" class="copy-button">
                            <span class="material-symbols-outlined" style="color: #fff;">content_copy</span>复制
                        </button>
                    </p>
                </div>
                <div id="instructions">
                    <h5>使用说明：</h5>
                    <p>1. 输入RGB或16进制颜色值，支持以下格式：</p>
                    <p>• HEX格式：#279cff 或 279cff</p>
                    <p>• RGB格式：rgb(39, 156, 255) 或 rgb(39,156,255)</p>
                    <p>2. 颜色预览会实时更新</p>
                    <p>3. 可以点击复制按钮复制转换结果</p>
                </div>
            </div>
        </div>
    </div>
    
    <div class="success-message" id="successMessage">
        <span class="material-symbols-outlined">check_circle</span>
        <span id="successText">已复制到剪贴板</span>
    </div>
    
    <footer>
        <p>&copy; 2024-2025 <a href="https://jerryz.com.cn" target="_blank" rel="noopener">Jerry Zhou</a> | <a href="https://github.com/YangguangZhou/Material-You-Gadget" target="_blank" rel="noopener noreferrer">GitHub</a></p>
    </footer>

    <script>
        // 返回按钮功能
        document.getElementById('back-to-home').addEventListener('click', function() {
            window.location.href = 'https://md.jerryz.com.cn/';
        });

        const colorInput = document.getElementById('colorInput');
        const colorPicker = document.getElementById('colorPicker');
        const colorDisplay = document.getElementById('colorDisplay');
        const rgbValueEl = document.getElementById('rgbValue');
        const hexValueEl = document.getElementById('hexValue');

        // 初始化颜色选择器的值，使其与 colorDisplay 的初始背景（如果已设置）或默认值同步
        // 这里我们可以在页面加载时，如果 colorInput 有初始值，就触发一次转换
        // 或者直接设置 colorPicker 的默认值，并让 colorInput 跟随它
        // 为简单起见，我们假设 colorPicker 的初始值是 #006A6A (与 primary color 类似)
        // 并在 colorInput 为空时，使用 colorPicker 的值
        
        function updateColorValues(inputValue) {
            let colorValue = inputValue.trim();
            
            if (!colorValue) {
                // 如果输入为空，尝试使用颜色选择器的值
                colorValue = colorPicker.value;
                 // 如果 colorPicker 的值也导致 colorValue 为空（不太可能，但作为保险），则重置
                if (!colorValue) {
                    colorDisplay.style.backgroundColor = '';
                    rgbValueEl.textContent = '--';
                    hexValueEl.textContent = '--';
                    return;
                }
            }
            
            try {
                let originalInputForPicker = colorValue; // 保存原始输入，用于后续设置picker

                if (!colorValue.includes('#') && /^[0-9A-Fa-f]{3}$/.test(colorValue)) { // 支持3位hex无#
                    colorValue = '#' + colorValue;
                    originalInputForPicker = colorValue;
                } else if (!colorValue.includes('#') && /^[0-9A-Fa-f]{6}$/.test(colorValue)) { // 支持6位hex无#
                    colorValue = '#' + colorValue;
                    originalInputForPicker = colorValue;
                }
                
                if (colorValue.toLowerCase().includes('rgb')) {
                    colorValue = colorValue.replace(/\s+/g, '');
                    colorValue = colorValue.replace(/rgb\((\d+),(\d+),(\d+)\)/i, 'rgb($1, $2, $3)');
                }
                
                colorDisplay.style.backgroundColor = colorValue;
                
                let r, g, b, hexForPicker;

                if (/^#([0-9A-Fa-f]{3}){1,2}$/.test(colorValue)) {
                    let hex = colorValue.substring(1);
                    if (hex.length === 3) {
                        hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
                    }
                    
                    r = parseInt(hex.substring(0, 2), 16);
                    g = parseInt(hex.substring(2, 4), 16);
                    b = parseInt(hex.substring(4, 6), 16);
                    
                    rgbValueEl.textContent = `rgb(${r}, ${g}, ${b})`;
                    hexValueEl.textContent = `#${hex}`.toUpperCase();
                    hexForPicker = `#${hex}`;
                } 
                else if (/^rgb\((\s*\d+\s*,\s*\d+\s*,\s*\d+\s*)\)$/i.test(colorValue)) {
                    const matches = colorValue.match(/(\d+)/g);
                    if (matches && matches.length >= 3) {
                        [r, g, b] = matches.map(val => parseInt(val));
                        
                        // 验证RGB值范围
                        if (r < 0 || r > 255 || g < 0 || g > 255 || b < 0 || b > 255) {
                            throw new Error("RGB值超出范围 (0-255)");
                        }

                        rgbValueEl.textContent = `rgb(${r}, ${g}, ${b})`;
                        
                        const hexR = r.toString(16).padStart(2, '0');
                        const hexG = g.toString(16).padStart(2, '0');
                        const hexB = b.toString(16).padStart(2, '0');
                        hexValueEl.textContent = `#${hexR}${hexG}${hexB}`.toUpperCase();
                        hexForPicker = `#${hexR}${hexG}${hexB}`;
                    } else {
                        throw new Error("无效的RGB格式");
                    }
                } else {
                    throw new Error("无效的颜色格式");
                }

                // 更新颜色选择器的值，但不触发其input事件，避免无限循环
                if (hexForPicker && colorPicker.value.toLowerCase() !== hexForPicker.toLowerCase()) {
                    colorPicker.value = hexForPicker;
                }

            } catch (error) {
                colorDisplay.style.backgroundColor = 'transparent'; // 清除无效颜色预览
                rgbValueEl.textContent = '无效的值';
                hexValueEl.textContent = '无效的值';
                // console.error("颜色转换错误:", error.message);
            }
        }

        // 文本输入框事件监听
        colorInput.addEventListener('input', function() {
            updateColorValues(this.value);
        });
        
        // 颜色选择器事件监听
        colorPicker.addEventListener('input', function() {
            colorInput.value = this.value; // 将颜色选择器的值赋给文本框
            updateColorValues(this.value); // 直接用选择器的值更新，因为它是标准的HEX
        });

        // 页面加载时，如果输入框为空，则使用颜色选择器的默认值进行一次初始化
        if (!colorInput.value.trim()) {
            colorInput.value = colorPicker.value; // 将选择器的初始值赋给输入框
        }
        updateColorValues(colorInput.value); // 初始加载时处理一次，确保同步


        // 复制功能
        document.getElementById('copyRgb').addEventListener('click', function() {
            const rgbText = rgbValueEl.textContent;
            if (rgbText !== '--' && rgbText !== '无效的值') {
                navigator.clipboard.writeText(rgbText).then(function() {
                    showSuccessMessage('RGB值已复制');
                });
            }
        });
        
        document.getElementById('copyHex').addEventListener('click', function() {
            const hexText = hexValueEl.textContent;
            if (hexText !== '--' && hexText !== '无效的值') {
                navigator.clipboard.writeText(hexText).then(function() {
                    showSuccessMessage('十六进制值已复制');
                });
            }
        });
        
        // 显示成功消息
        function showSuccessMessage(text) {
            const successMessage = document.getElementById('successMessage');
            const successText = document.getElementById('successText');
            
            successText.textContent = text;
            successMessage.classList.add('show');
            
            setTimeout(function() {
                successMessage.classList.remove('show');
            }, 2000);
        }
    </script>
