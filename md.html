<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Jerry Zhou" />
  <link rel="icon" href="/favicon.png" />
  <meta name="keywords" content="markdown generator, markdown to rich text, markdown to rtf, markdown converter, markdown, tables, mathjax" />
  <title>Markdown 至 富文本 转换器</title>

  <!-- 字体 & 图标 -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- 引入 Marked.js （支持 GFM，包括表格、任务列表等） -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- MathJax v3，用于支持 LaTeX 数学公式 -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$','$$'], ['\\[','\\]']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js" id="MathJax" async></script>

  <style>
    :root {
      --primary-color: #6750A4;
      --on-primary-color: #FFFFFF;
      --surface-color: #FFFBFE;
      --on-surface-color: #1C1B1F;
      --secondary-color: #E8DEF8;
      --error-color: #B00020;
      --border-radius: 16px;
      --elevation: 0 8px 16px rgba(0, 0, 0, 0.15);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Roboto', sans-serif;
      line-height: 1.6;
      background-color: var(--surface-color);
      color: var(--on-surface-color);
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 1200px;
      background-color: #FFFFFF;
      border-radius: var(--border-radius);
      box-shadow: var(--elevation);
      overflow: hidden;
    }
    .app-bar {
      background-color: var(--primary-color);
      color: var(--on-primary-color);
      padding: 20px;
      font-size: 24px;
      font-weight: 500;
      text-align: center;
    }
    .content {
      padding: 24px;
    }
    .description {
      font-size: 1rem;
      text-align: center;
      margin-bottom: 24px;
    }
    /* 让输入框和预览框对齐 */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start; 
    }
    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
    .input-section,
    .preview-section {
      display: flex;
      flex-direction: column;
    }
    .label {
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--on-surface-color);
    }
    .textarea {
      width: 100%;
      height: 500px;
      padding: 16px;
      border: 1px solid var(--secondary-color);
      border-radius: 8px;
      font-family: monospace;
      resize: vertical;
      outline: none;
    }
    .preview {
      flex-grow: 1;
      width: 100%;
      height: 500px;
      padding: 16px;
      border: 1px solid var(--secondary-color);
      border-radius: 8px;
      overflow-y: auto;
      background-color: #FFFFFF;
    }
    .button-container {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      padding: 12px 24px;
      font-size: 0.875rem;
      font-weight: 500;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
    }
    .btn .material-icons {
      font-size: 1.2rem;
      margin-right: 8px;
    }
    .btn-copy {
      background-color: var(--primary-color);
      color: var(--on-primary-color);
    }
    .btn-html {
      background-color: #388E3C;
      color: #FFFFFF;
    }
    .btn-word {
      background-color: #1976D2;
      color: #FFFFFF;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.25);
    }
    .btn:active {
      transform: translateY(0);
      box-shadow: 0 3px 6px rgba(0,0,0,0.15);
    }
    .copy-toast {
      position: fixed;
      left: 50%;
      top: 10%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #FFFFFF;
      padding: 0.8rem 1.2rem;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 1000;
    }
    .copy-toast.show {
      opacity: 1;
    }
    /* 预览样式 */
    .preview h1 {
      font-size: 2em;
      margin: 0.67em 0;
    }
    .preview h2 {
      font-size: 1.5em;
      margin: 0.83em 0;
    }
    .preview h3 {
      font-size: 1.17em;
      margin: 1em 0;
    }
    .preview ul,
    .preview ol {
      padding-left: 2em;
      margin: 1em 0;
    }
    .preview p {
      margin: 1em 0;
    }
    .preview code {
      background-color: var(--secondary-color);
      padding: 0.2em 0.4em;
      border-radius: 4px;
      font-family: monospace;
    }
    .preview pre {
      background-color: var(--secondary-color);
      padding: 16px;
      border-radius: 12px;
      overflow-x: auto;
    }
    .preview pre code {
      background-color: transparent;
      padding: 0;
    }
    /* 链接与图片 */
    .preview a {
      color: var(--primary-color);
      text-decoration: none;
    }
    .preview a:hover {
      text-decoration: underline;
    }
    .preview img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 1em 0;
    }
    /* 表格 */
    .preview table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0;
    }
    .preview table,
    .preview th,
    .preview td {
      border: 1px solid #ddd;
    }
    .preview th,
    .preview td {
      padding: 0.6em 1em;
      text-align: left;
    }
    /* 任务列表 */
    .preview input[type="checkbox"] {
      margin-right: 0.5em;
    }
    /* 水平分割线 */
    .preview hr {
      border: 0;
      border-top: 2px solid var(--secondary-color);
      margin: 1.5em 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="app-bar">Markdown转换器</header>
    <div class="content">
      <p class="description">
        当前转换器已支持表格、任务列表、分割线、LaTeX 公式、图片等更多 Markdown 特性。转换后的富文本可直接复制、保存为 HTML 或 DOCX！
      </p>

      <div class="grid">
        <!-- 左侧：输入框 -->
        <div class="input-section">
          <label class="label" for="markdown-input">Markdown 输入</label>
          <textarea id="markdown-input" class="textarea" placeholder="在这里输入 Markdown 文本..."></textarea>
        </div>

        <!-- 右侧：按钮与预览 -->
        <div class="preview-section">
          <div class="button-container">
            <button id="copy-button" class="btn btn-copy">
              <span class="material-icons">content_copy</span>
              复制富文本
            </button>
            <button id="save-html-button" class="btn btn-html">
              <span class="material-icons">code</span>
              保存为 HTML
            </button>
            <button id="save-word-button" class="btn btn-word">
              <span class="material-icons">description</span>
              保存为 DOCX
            </button>
          </div>
          <div id="preview" class="preview"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="copy-toast" class="copy-toast">富文本已复制！</div>

  <script>
    const markdownInput = document.getElementById('markdown-input');
    const preview = document.getElementById('preview');
    const copyButton = document.getElementById('copy-button');
    const saveHtmlButton = document.getElementById('save-html-button');
    const saveWordButton = document.getElementById('save-word-button');
    const copyToast = document.getElementById('copy-toast');

    // 开启 GFM 支持（包含表格、任务列表等），并自动换行
    marked.setOptions({
      gfm: true,
      breaks: false
    });

    // 将 Markdown 转换为 HTML
    function convertToHTML(md) {
      // 使用 Marked.js 渲染
      const rawHTML = marked.parse(md);
      return rawHTML;
    }

    // 实时预览
    markdownInput.addEventListener('input', function() {
      const html = convertToHTML(this.value);
      preview.innerHTML = html;
      // 让 MathJax 重新渲染公式
      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise([preview]);
      }
    });

    // 显示弹窗
    function showToast(message) {
      copyToast.textContent = message;
      copyToast.classList.add('show');
      setTimeout(() => {
        copyToast.classList.remove('show');
      }, 2000);
    }

    // 优先使用 Clipboard API 复制富文本，否则降级
    copyButton.addEventListener('click', function() {
      const htmlContent = preview.innerHTML;
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = htmlContent;
      try {
        const clipboardData = new DataTransfer();
        clipboardData.setData('text/html', htmlContent);
        clipboardData.setData('text/plain', tempDiv.textContent);
        navigator.clipboard.write([
          new ClipboardItem({
            'text/html': new Blob([htmlContent], { type: 'text/html' }),
            'text/plain': new Blob([tempDiv.textContent], { type: 'text/plain' })
          })
        ]).then(() => {
          showToast('富文本已复制！');
        }).catch(err => {
          // 如果出现错误则进行降级复制
          fallbackCopy(tempDiv.textContent);
        });
      } catch (err) {
        fallbackCopy(tempDiv.textContent);
      }
    });

    function fallbackCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('已复制（纯文本格式）！');
      } catch (err) {
        showToast('复制失败，请手动复制');
      }
      document.body.removeChild(textarea);
    }

    // 保存为 HTML
    function saveAsHTML() {
      const htmlContent = preview.innerHTML;
      const blob = new Blob([htmlContent], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'document.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // 保存为 DOCX（简单保存在 docx 后缀下，让 Word 打开，可能对复杂场景兼容不完美）
    function saveAsDocx() {
      const content =
        '<html><head><meta charset="utf-8"><title>Document</title></head><body>' +
        preview.innerHTML +
        '</body></html>';
      const blob = new Blob([content], {
        type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'document.docx';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    saveHtmlButton.addEventListener('click', saveAsHTML);
    saveWordButton.addEventListener('click', saveAsDocx);
  </script>
</body>
</html>
