<body>
  <button id="back-to-home" class="back-to-home-btn" title="返回主站">

    <div class="content">
      <p class="description">
        将 Markdown 文本即时转换为富文本预览或纯 HTML 代码。支持 GFM 表格、任务列表、代码高亮、LaTeX 数学公式、图片等多种 Markdown 特性。
      </p>

      <div class="grid">
        <div class="input-section">
          <label class="label" for="markdown-input">Markdown 输入 (支持 LaTeX 公式)</label>
          <textarea id="markdown-input" class="textarea"
            placeholder="在此处输入 Markdown 文本... 例如：&#10;&#10;```python&#10;print('Hello World!')&#10;```&#10;&#10;$$E = mc^2$$"></textarea>
        </div>

        <div class="preview-section">
          <div class="button-container">
            <button id="copy-button" class="btn btn-copy">
              <span class="material-icons-outlined">content_copy</span>
              复制富文本
            </button>
            <button id="save-html-button" class="btn btn-save-html">
              <span class="material-icons-outlined">save_alt</span>
              保存为 HTML
            </button>
          </div>
          <label class="label" for="preview">实时预览</label>
          <div id="preview" class="preview">输入 Markdown 内容后，这里会显示渲染后的效果。</div>
        </div>

          rel="noopener noreferrer">GitHub</a></p>
    </footer>

  <div id="copy-toast" class="copy-toast">消息提示</div>



  <script>
    const markdownInput = document.getElementById('markdown-input');
    const preview = document.getElementById('preview');
    const copyButton = document.getElementById('copy-button');
    const saveHtmlButton = document.getElementById('save-html-button');
    const backToHomeButton = document.getElementById('back-to-home');
    const copyToast = document.getElementById('copy-toast');

    // Marked.js Configuration
    marked.setOptions({
      gfm: true,
      breaks: false,
      pedantic: false,
      sanitize: false,  // IMPORTANT: If you expect user-generated content that might be malicious, set this to true or use a sanitizer library like DOMPurify.
      smartLists: true,
      smartypants: true
    });

    // Debounce function
    function debounce(func, delay) {
      let timeoutId;
      return function (...args) {
        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => {
          func.apply(this, args);
        }, delay);
      };
    }

    // Update preview function
    function updatePreview() {
      const markdownText = markdownInput.value;
      const placeholderText = '<p style=\"color: #757575; text-align: center; margin-top: 20px;\">输入 Markdown 内容后，这里会显示渲染后的效果。</p>';

      if (markdownText.trim() === '') {
        preview.innerHTML = placeholderText;
        return;
      }
      const rawHTML = marked.parse(markdownText);
      preview.innerHTML = rawHTML;

      if (window.MathJax && typeof window.MathJax.typesetPromise === 'function' && markdownText.includes('$')) {
        MathJax.typesetPromise([preview]).catch(function (err) {
          console.error('MathJax typesetPromise failed:', err);
        });
      } else if (window.MathJax && typeof window.MathJax.typeset === 'function' && markdownText.includes('$')) {
        MathJax.typeset([preview]);
      }
    }

    const debouncedUpdatePreview = debounce(updatePreview, 300);
    markdownInput.addEventListener('input', debouncedUpdatePreview);

    if (markdownInput.value) {
      updatePreview(); // Initial render if content exists
    }

    // Show toast message
    function showToast(message, duration = 2500) {
      copyToast.textContent = message;
      copyToast.classList.add('show');
      setTimeout(() => {
        copyToast.classList.remove('show');
      }, duration);
    }

    // Copy rich text
    copyButton.addEventListener('click', function () {
      const htmlContent = preview.innerHTML;
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = htmlContent;
      const plainText = tempDiv.textContent || tempDiv.innerText || "";
      const placeholderHTML = '<p style=\"color: #757575; text-align: center; margin-top: 20px;\">输入 Markdown 内容后，这里会显示渲染后的效果。</p>';

      if (!htmlContent.trim() || htmlContent === placeholderHTML) {
        showToast('没有内容可以复制', 2000);
        return;
      }

      try {
        const htmlBlob = new Blob([htmlContent], { type: 'text/html' });
        const textBlob = new Blob([plainText], { type: 'text/plain' });

        navigator.clipboard.write([
          new ClipboardItem({
            'text/html': htmlBlob,
            'text/plain': textBlob
          })
        ]).then(() => {
          showToast('富文本已复制到剪贴板！');
        }).catch(err => {
          console.warn('Clipboard API failed, falling back.', err);
          fallbackCopy(plainText, htmlContent);
        });
      } catch (e) {
        console.warn('Clipboard API not available or error, falling back.', e);
        fallbackCopy(plainText, htmlContent);
      }
    });

    // Fallback copy function
    function fallbackCopy(plainText, htmlContent) {
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = htmlContent;
      document.body.appendChild(tempDiv);

      const range = document.createRange();
      range.selectNodeContents(tempDiv);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);

      let success = false;
      try {
        success = document.execCommand('copy');
      } catch (err) {
        console.error('Fallback HTML copy execCommand failed:', err);
      }
      selection.removeAllRanges();
      document.body.removeChild(tempDiv);

      if (success) {
        showToast('富文本已复制 (兼容模式)！');
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = plainText;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          showToast('已复制为纯文本！');
        } catch (err) {
          showToast('复制失败，请手动复制。');
          console.error('Fallback plain text copy execCommand failed:', err);
        }
        document.body.removeChild(textarea);
      }
    }

    // Save as HTML
    saveHtmlButton.addEventListener('click', function () {
      const currentHtmlContent = preview.innerHTML;
      const placeholderHTML = '<p style=\"color: #757575; text-align: center; margin-top: 20px;\">输入 Markdown 内容后，这里会显示渲染后的效果。</p>';
      if (!currentHtmlContent.trim() || currentHtmlContent === placeholderHTML) {
        showToast('没有内容可以保存', 2000);
        return;
      }

      const title = "Markdown Document";
      const fullHtml = `
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
