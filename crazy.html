    <script>
        function isNumber(n) {
            return !isNaN(parseFloat(n)) && isFinite(n);
        }

        function convertToChinese(num) {
            const chineseNum = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
            if(Number.isInteger(num) && num >= 1 && num <= 10) {
                return chineseNum[num - 1];
            } else {
                return num.toFixed(2);
            }
        }

        function calculate() {
            const number = document.getElementById('number').value;

            if (!isNumber(number) || number <= 0) {
                const resultElement = document.getElementById('result');
                resultElement.textContent = "输入错误，请输入有效金额";
                resultElement.style.backgroundColor = "var(--md-sys-color-error)";
                resultElement.style.color = "white";
                resultElement.classList.add('visible');
                document.getElementById('copyButton').style.display = 'none';
                return;
            }

            let result = (4 * number) / 50;
            result = `今天是疯狂星期${convertToChinese(result)}，v我${number}`;

            const resultElement = document.getElementById('result');
            resultElement.textContent = result;
            resultElement.style.backgroundColor = "var(--md-sys-color-primary-container)";
            resultElement.style.color = "var(--md-sys-color-on-primary-container)";
            resultElement.classList.add('visible');
            document.getElementById('copyButton').style.display = 'block';
        }

        function copyResult() {
            var copyText = document.getElementById("result");
            var textArea = document.createElement("textarea");
            textArea.value = copyText.textContent;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand("Copy");
            textArea.remove();
            alert("结果已复制到剪贴板！");
        }
        
        // 返回按钮功能
        document.getElementById('back-to-home').addEventListener('click', function() {
            window.location.href = 'https://md.jerryz.com.cn/';
        });
