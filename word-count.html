        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: var(--elevation-1);
    }
    
    .clear-btn:hover {
        box-shadow: var(--elevation-2);
        transform: translateY(-1px);

    .stats-grid {

    .stat-card.english-words {

    /* 返回按钮样式 */

<body>
    <!-- 返回按钮 -->
    <button id="back-to-home" class="back-to-home-btn" title="返回主站">
        <span class="material-icons-outlined">arrow_back</span>
    </button>
    
    <div class="container">
        <div class="app-bar">字数统计工具</div>
        <div class="content">
            <div class="section">
                <div class="section-title">
                    <span>文本输入</span>
                    <button class="clear-btn" onclick="clearText()">清除</button>
                </div>
                <div class="textarea-container">
                    <textarea 
                        id="textInput" 
                        placeholder="请在此输入您要统计的文本内容..."
                        rows="8"
                    ></textarea>
                </div>
            </div>

            <div class="section">
                <div class="section-title">统计结果</div>
                <div class="stats-grid">
                    <div class="stat-card chinese-with-punc">
                        <div class="stat-label">中文字数（含标点）</div>
                        <div class="stat-number" id="chineseWithPunc">0</div>
                    </div>
                    
                    <div class="stat-card chinese-without-punc">
                        <div class="stat-label">中文字数（不含标点）</div>
                        <div class="stat-number" id="chineseWithoutPunc">0</div>
                    </div>
                    
                    <div class="stat-card english-words">
                        <div class="stat-label">英文词数</div>
                        <div class="stat-number" id="englishWords">0</div>
                    </div>
                    
                    <div class="stat-card english-letters">
                        <div class="stat-label">英文字母数</div>
                        <div class="stat-number" id="englishLetters">0</div>
                    </div>
                    
                    <div class="stat-card total-chars">
                        <div class="stat-label">总字符数</div>
                        <div class="stat-number" id="totalChars">0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <p>&copy; 2024-2025 <a href="https://jerryz.com.cn" target="_blank" rel="noopener">Jerry Zhou</a> | <a href="https://github.com/YangguangZhou/Material-You-Gadget" target="_blank" rel="noopener noreferrer">GitHub</a></p>
    </footer>

    <script>
        // 获取DOM元素
        const textInput = document.getElementById('textInput');
        const chineseWithPuncElement = document.getElementById('chineseWithPunc');
        const chineseWithoutPuncElement = document.getElementById('chineseWithoutPunc');
        const englishWordsElement = document.getElementById('englishWords');
        const englishLettersElement = document.getElementById('englishLetters');
        const totalCharsElement = document.getElementById('totalChars');

        // 统计函数
        function countText(text) {
            // 中文字符正则（包含中文标点）
            const chineseWithPuncRegex = /[\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]/g;

            // 中文字符正则（不包含标点，仅中文字符）
            const chineseWithoutPuncRegex = /[\u4e00-\u9fff]/g;

            // 英文字母正则
            const englishLettersRegex = /[a-zA-Z]/g;

            // 英文单词正则（以非字母字符分隔）
            const englishWordsRegex = /[a-zA-Z]+/g;

            const results = {
                chineseWithPunc: (text.match(chineseWithPuncRegex) || []).length,
                chineseWithoutPunc: (text.match(chineseWithoutPuncRegex) || []).length,
                englishWords: (text.match(englishWordsRegex) || []).length,
                englishLetters: (text.match(englishLettersRegex) || []).length,
                totalChars: text.length
            };

            return results;
        }

        // 更新统计结果显示
        function updateCountDisplay(counts) {
            chineseWithPuncElement.textContent = counts.chineseWithPunc.toLocaleString();
            chineseWithoutPuncElement.textContent = counts.chineseWithoutPunc.toLocaleString();
            englishWordsElement.textContent = counts.englishWords.toLocaleString();
            englishLettersElement.textContent = counts.englishLetters.toLocaleString();
            totalCharsElement.textContent = counts.totalChars.toLocaleString();
            
            // 添加动画效果
            document.querySelectorAll('.stat-number').forEach(el => {
                el.style.transform = 'scale(1.1)';
                setTimeout(() => {
                    el.style.transform = 'scale(1)';
                }, 150);
            });
        }

        // 实时统计
        function performCount() {
            const text = textInput.value;
            const counts = countText(text);
            updateCountDisplay(counts);
        }

        // 清除文本
        function clearText() {
            if (textInput.value.trim() === '') {
                return;
            }

            if (confirm('确定要清除所有文本吗？')) {
                textInput.value = '';
                performCount();
                textInput.focus();
            }
        }

        // 事件监听
        textInput.addEventListener('input', performCount);
        textInput.addEventListener('paste', () => {
            setTimeout(performCount, 10);
        });

        // 返回按钮功能
        document.getElementById('back-to-home').addEventListener('click', function() {
            window.location.href = 'https://md.jerryz.com.cn/';
        });

        // 页面加载完成后执行初始统计
        document.addEventListener('DOMContentLoaded', () => {
            performCount();
            textInput.focus();
        });
    </script>
    <script>
        (function() {
            const applySafeAreaPadding = () => {
                const cap = window.Capacitor;
                const platform = cap?.getPlatform?.();
                if (platform && platform !== 'web') {
                    const current = parseFloat(window.getComputedStyle(document.body).paddingTop) || 0;
                    document.body.style.paddingTop = `calc(${current}px + env(safe-area-inset-top, 0px) + 16px)`;
                    document.body.classList.add('capacitor-safe-area');

                    const statusBar = cap?.StatusBar ?? cap?.Plugins?.StatusBar;
                    if (statusBar?.setStyle) {
                        statusBar.setStyle({ style: 'DARK' }).catch(() => {});
                    }
                    if (statusBar?.setBackgroundColor) {
                        statusBar.setBackgroundColor({ color: '#0f172a' }).catch(() => {});
                    }
                }
            };

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', applySafeAreaPadding, { once: true });
            } else {
                applySafeAreaPadding();
            }
        })();
    </script>
</body>
